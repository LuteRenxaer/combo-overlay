[package]
name = "combo-overlay"
version = "0.1.0"
edition = "2021"
description = "趣味悬浮连击计数器：透明置顶悬浮窗，记录你按下过多少个键，每按一次播放 click.ogg（COMBO 逻辑分离自 phirLie 的 game.rs）"

[dependencies]
ab_glyph = "0.2"
rodio = { version = "0.20", features = ["vorbis"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 独立项目，不并入上级 phirLie workspace
[workspace]

[profile.release]
opt-level = 3
